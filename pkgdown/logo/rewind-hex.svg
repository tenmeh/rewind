<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 116" width="100" height="116">
  <!--
    rewind hex logo. Tape deck colourway: amber on charcoal.

    The chevrons are the tape transport symbol for rewind, so the mark says
    the name of the package. Amber on near-black is the display of a deck.

    The hexagon is inset by 2 units. A stroke sits on the centre of its
    path, so a hexagon drawn to the edge of the viewBox would have half of
    its border cut off.

    The wordmark uses Poppins, the typeface of the documentation site. It
    is not installed as a system font, so build-logo.R renders this file in
    a headless browser that loads the site's own copy of the font.
  -->
  <path d="M50 2 L98 30 L98 86 L50 114 L2 86 L2 30 Z" fill="#1F1D1B"/>
  <path d="M50 2 L98 30 L98 86 L50 114 L2 86 L2 30 Z" fill="none"
        stroke="#F0A830" stroke-width="3" stroke-linejoin="round"/>
  <path d="M48 32 L27 51 L48 70 Z" fill="#F0A830"/>
  <path d="M73 32 L52 51 L73 70 Z" fill="#F0A830"/>
  <text x="50" y="96" text-anchor="middle" font-size="15" font-weight="500"
        fill="#F0A830" font-family="Poppins, sans-serif">rewind</text>
</svg>

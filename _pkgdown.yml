url: https://tenmeh.github.io/rewind/

template:
  bootstrap: 5
  light-switch: true
  default-theme: light
  bslib:
    # The site has the shapes of the blog of the author (tenmeh.github.io),
    # and the colours of the logo: the charcoal (#1F1D1B) and the amber
    # (#F0A830). In the light mode the ground is a cream with a tint of the
    # amber, and the ink is the charcoal. In the dark mode the ground is the
    # charcoal. Bootstrap makes its own tints and shades from these values,
    # so they are set here and not only in extra.css, which holds the same
    # values in its tokens. Change both places together.
    bg: "#fbf6ec"
    fg: "#1f1d1b"
    body-bg-dark: "#1f1d1b"
    body-color-dark: "#f2ebdf"
    border-color: "#e6dcc8"
    border-color-dark: "#36312b"
    # The amber of the logo is too light for text on the cream: 1.8:1, and
    # WCAG AA asks for 4.5:1. The light mode thus uses a dark amber of the
    # same hue. It gives 6.8:1 on the paper, and 5.0:1 at the centre of the
    # glows, where the ground is at its most amber. extra.css lists the
    # contrast of each colour.
    #
    # The dark mode does not derive its link colour from this one. Bootstrap
    # would lighten it by 40%, which gives a tan that looks little like the
    # logo. The logo amber itself gives 8.3:1 on the charcoal, so the dark
    # mode uses it as it is.
    primary: "#7A4C06"
    link-color-dark: "#F0A830"
    # Geist for the text and the headings, and Geist Mono for the code, as on
    # the blog. bslib downloads the files from Google Fonts when the site is
    # built, and the site serves them itself. A visitor thus makes no request
    # to Google.
    base_font:
      google:
        family: "Geist"
        wght: "400..800"
    heading_font:
      google:
        family: "Geist"
        wght: "400..800"
    code_font:
      google:
        family: "Geist Mono"
        wght: "400..600"
    font-size-root: "17px"
    headings-font-weight: 600
    line-height-base: 1.72
    # The cards and the code blocks of the blog have round corners of about
    # 10 to 14px. Bootstrap uses this value for its own boxes.
    border-radius: "0.6rem"

  # The picture that Slack, LinkedIn, X and WhatsApp show when the address of
  # the site is shared. Without it pkgdown uses the logo, which is a small
  # hex and looks lost in a wide preview. The files are in pkgdown/assets, so
  # they are copied to the root of the site, and a relative src is made
  # absolute with the url above. pkgdown allows one image only, and it is the
  # GIF: Slack and Discord play it, so the hex moves in the preview. Frame 0
  # of the GIF is the still card.png, so LinkedIn, X, WhatsApp and iMessage,
  # which do not animate, show that. card.png is kept in the repository as the
  # still, and as the source of truth if the GIF is made again. Both are made
  # by scripts/site-card in the repository of the blog (tenmeh.github.io).
  # Make them again there if the tagline below, or the look of the site,
  # changes.
  opengraph:
    image:
      src: card.gif
      alt: "The word rewind in large letters with the tagline Undo and redo for Shiny, beside the amber rewind hex logo, which spins back, with a slider, a dropdown and an undo arrow around it."

  # X shows the large picture only when the page says so with twitter:card.
  # pkgdown can write that tag from "opengraph: twitter:", but it then
  # refuses to build unless the block also names a "creator" or a "site", and
  # that is an account on X, which this package does not have. So the tag is
  # written here by hand. If an account is added later, move this into
  # "opengraph: twitter: card:" with the "creator". The description is
  # written here also, the same text as home: description below, so that a
  # preview has a line of text under the title on every page.
  includes:
    in_header: |
      <meta name="twitter:card" content="summary_large_image">
      <meta property="og:description" content="Adds a user-facing undo and redo history to Shiny applications, with coalescing so a slider drag is one step rather than forty.">
      <meta name="twitter:description" content="Adds a user-facing undo and redo history to Shiny applications, with coalescing so a slider drag is one step rather than forty.">

home:
  title: Undo and redo for Shiny
  description: >
    Adds a user-facing undo and redo history to Shiny applications, with
    coalescing so a slider drag is one step rather than forty.
  sidebar:
    # The built-in "dev" component holds the badges. pkgdown gives it the
    # heading "Dev status", which is wrong for a release badge. This
    # structure leaves "dev" out and uses the "status" component below in
    # its place. The badges thus keep their position, with a correct
    # heading.
    #
    # The badges appear here and in the README. pkgdown reads the README
    # for the "dev" component only, and that component is not in use.
    # Change both places together.
    structure: [status, links, license, citation, authors]
    components:
      status:
        title: Status
        text: |
          [![CRAN status](https://www.r-pkg.org/badges/version/rewind)](https://CRAN.R-project.org/package=rewind)
          [![CRAN downloads](https://cranlogs.r-pkg.org/badges/grand-total/rewind)](https://CRAN.R-project.org/package=rewind)
          [![R-CMD-check](https://github.com/tenmeh/rewind/actions/workflows/R-CMD-check.yaml/badge.svg)](https://github.com/tenmeh/rewind/actions/workflows/R-CMD-check.yaml)

navbar:
  structure:
    left: [intro, reference, news]
    right: [search, lightswitch, github]
  components:
    intro:
      text: Get Started
      href: articles/get-started.html
    reference:
      text: Reference
      href: reference/index.html
    news:
      text: Changelog
      href: news/index.html
    github:
      icon: fa-github fa-lg
      href: https://github.com/tenmeh/rewind
      aria-label: GitHub repository

reference:
  - title: Getting started
    desc: >
      The one call that turns undo on, and the one that extends it to state
      Shiny cannot see for itself.
    contents:
      - rewind_enable
      - rewind_track

  - title: Choosing what is captured
    desc: >
      By default rewind captures every input the page can put back. Leave
      inputs out from anywhere, a module included, and see what is captured
      and why an input is not.
    contents:
      - rewind_exclude
      - rewind_status

  - title: Controlling what becomes a step
    desc: >
      Time-based coalescing handles the common case. These are for when the
      boundary between steps is a decision rather than a pause, or when
      capture needs to stop altogether.
    contents:
      - rewind_step
      - rewind_unrecorded
      - rewind_pause
      - rewind_disable

  - title: Driving the history yourself
    desc: >
      The keyboard shortcuts and the bundled buttons cover most needs; these
      let you wire the history to your own controls, and read its state
      reactively.
    contents:
      - rewind_undo
      - rewind_history
      - rewind_diff

  - title: User interface
    desc: Drop-in controls, and the asset bundle behind them.
    contents:
      - rewind_buttons
      - rewind_ui
      - rewind_dependency

  - title: Package
    contents:
      - rewind-package

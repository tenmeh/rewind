# Measure how much of the R code the tests run, with covr.
#
# The tidyverse sends this to codecov. This workflow does not, so that it
# needs no account and no token. It writes the result to the summary of the
# run instead: the total, and one line for each file. Open the run on the
# Actions tab to read it. To add codecov later, add
# codecov/codecov-action@v5 after the covr step, and a CODECOV_TOKEN secret.
#
# covr counts only the R code that runs in this process. The browser tests
# start the application in a second R process, so the lines that only they
# reach do not count. The real coverage is thus a little higher than the
# number here.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

name: test-coverage

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # The browser tests call skip_on_cran(). This runs them, as in
      # R-CMD-check.yaml.
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr
          needs: coverage

      - name: Measure the coverage
        shell: Rscript {0}
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          res <- covr::coverage_to_list(cov)
          files <- sort(res$filecoverage)
          lines <- c(
            sprintf("## Test coverage: %.1f%%", res$totalcoverage),
            "",
            "| File | Coverage |",
            "|---|---|",
            sprintf("| `%s` | %.1f%% |", names(files), files)
          )
          cat(lines, sep = "\n", file = Sys.getenv("GITHUB_STEP_SUMMARY"), append = TRUE)

      - name: Show the output of testthat
        if: always()
        run: |
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Keep the output of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package

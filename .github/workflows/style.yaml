# A formatter that you start by hand. It is not automatic, and this is
# intentional. lint.yaml decides pass or fail. This workflow corrects the
# problems that lint.yaml reports.
#
# It opens a pull request. It does not push to main. main needs a pull
# request and a linear history. A direct push from a bot thus fails.
on:
  workflow_dispatch:

name: style

permissions:
  contents: write
  pull-requests: write

jobs:
  style:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::styler, any::roxygen2
          needs: styler

      - name: Style
        run: styler::style_pkg()
        shell: Rscript {0}

      - name: Open a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/styler
          delete-branch: true
          title: "chore(style): apply styler::style_pkg()"
          body: |
            Automated `styler::style_pkg()` run, triggered manually.

            Review the diff before merging - styler reformats mechanically and
            occasionally makes deliberate alignment worse. Confirm
            `lintr::lint_package()` is still clean afterwards.
          commit-message: "chore(style): apply styler::style_pkg()"

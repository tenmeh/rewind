# Multi-platform R CMD check, run to CRAN standards.
#
# The matrix mirrors what CRAN itself builds on, so a green run here is
# reasonable evidence a submission will clear the incoming queue.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # The "New submission" and unreachable-URL notes only fire against the
      # live CRAN index and would red every run; the real CRAN incoming check
      # happens at submission time via devtools::check(remote = TRUE).
      _R_CHECK_CRAN_INCOMING_: false

    steps:
      - uses: actions/checkout@v4

      # No setup-pandoc here on purpose. The only NOTE pandoc suppresses is the
      # README.md/NEWS.md validation one, and that check is part of the CRAN
      # incoming set disabled above - so with _R_CHECK_CRAN_INCOMING_ false the
      # check is Status OK without pandoc present. Installing it anyway meant
      # every run depended on a GitHub release download that returns 503s often
      # enough to red the build for reasons that have nothing to do with the
      # package. The package ships no vignettes, so nothing else needs it.
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          # CRAN accepts no NOTEs, so neither does this gate.
          error-on: '"note"'
          upload-snapshots: true

# R CMD check on several systems, at CRAN standards.
#
# The matrix uses the same systems as CRAN. A successful run here is thus
# good evidence that CRAN will accept a submission.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # The "New submission" note and the unreachable-URL note occur only
      # against the live CRAN index. They would fail each run. Do the real
      # CRAN incoming check at submission time, with
      # devtools::check(remote = TRUE).
      _R_CHECK_CRAN_INCOMING_: false
      # The AppDriver smoke test calls skip_on_cran(). The check machines of
      # CRAN do not always have a headless Chrome. This variable makes the
      # test run here. Without it, the test skips on each system.
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      # There is no setup-pandoc step here, and this is intentional. pandoc
      # stops only one NOTE: the check of README.md and NEWS.md. That check
      # is part of the CRAN incoming set that the variable above disables.
      # The result is thus Status OK with no pandoc.
      #
      # A setup-pandoc step made each run depend on a download from a GitHub
      # release. That download returns 503 errors frequently. The build then
      # failed for a reason with no relation to the package. The package has
      # no vignettes, so no other step needs pandoc.
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          # CRAN accepts no NOTEs. This check thus accepts none.
          error-on: '"note"'
          upload-snapshots: true
